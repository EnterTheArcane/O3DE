name: Cache Artifact
description: >
  Automatically restore and save build cache artifacts across workflow runs.
  On setup, downloads and extracts a cache artifact from the current or a previous
  workflow run. On post-run, compresses and uploads the cache directory as an artifact.

inputs:
  name:
    description: Name of the cache artifact
    required: true
  path:
    description: >
      Path to the cache directory. Can be absolute or relative to $GITHUB_WORKSPACE.
      Everything under this directory is archived and restored as a single tar.
    required: false
    default: Cache
  search-previous:
    description: >
      Also search previous workflow runs on the target branch for the artifact.
      When false, only the current workflow run is checked (for job chaining).
      Maps to the last_artifact input in the calling workflow.
    required: false
    default: "false"
  save:
    description: >
      Whether to save the artifact in the post-run step.
      Set to false for test builds that should not update the cache.
    required: false
    default: "true"
  token:
    description: GitHub token for artifact API access
    required: false
    default: ${{ github.token }}

outputs:
  cache-hit:
    description: Whether a cache artifact was found and restored

runs:
  using: node24
  main: dist/main/index.js
  post: dist/post/index.js
  post-if: "!cancelled()"
