name: Provision
description: >
  Provision build tools on the runner. Each input specifies a tool version to
  install ("latest" or a specific version string). Omit an input to skip that tool.

inputs:
  cmake:
    description: CMake version to install (e.g. "4.2.3" or "latest")
    required: false
  ninja:
    description: Ninja version to install (e.g. "1.12.1" or "latest")
    required: false
  ccache:
    description: ccache version to install (e.g. "4.10.2" or "latest")
    required: false
  clang:
    description: Clang/LLVM version to install (e.g. "18" or "latest")
    required: false
  msvc:
    description: MSVC toolset version to install (e.g. "14.29")
    required: false

runs:
  using: node24
  main: dist/main/index.js
