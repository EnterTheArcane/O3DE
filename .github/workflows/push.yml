name: Push

on:
  push:

jobs:
  build:
    name: ${{ matrix.platform }}
    secrets: inherit
    uses: ./.github/workflows/build.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: Mac
            runner: macos-26
          - platform: Windows
            runner: windows-2022
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
    
