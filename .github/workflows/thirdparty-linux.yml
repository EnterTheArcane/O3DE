name: ThirdParty Linux

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      target_os:
        required: true
        type: string
      target_arch:
        required: true
        type: string
      recipes:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      image:
        description: Image
        required: false
        type: string
        default: ubuntu-24.04
      target_os:
        description: Target OS
        required: false
        type: string
        default: Linux
      target_arch:
        description: Target Arch
        required: false
        type: choice
        options:
          - X64
          - ARM
        default: X64
      recipes:
        description: "Optional whitespace-separated recipe names or glob patterns. Blank builds everything."
        required: false
        type: string

run-name: ThirdParty Linux ${{ inputs.target_arch }}

jobs:
  Build:
    runs-on: ${{ inputs.image }}

    env:
      THIRDPARTY_ROOT: Tools/ThirdParty

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          show-progress: false

      - name: Install Packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bash \
            binutils \
            build-essential \
            gcc-x86-64-linux-gnu \
            g++-x86-64-linux-gnu \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            pkg-config

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Tools/ThirdParty/pyproject.toml

      - name: Install Tool
        run: python -m pip install -e "${{ env.THIRDPARTY_ROOT }}"

      - name: Check ThirdParty command
        run: thirdparty --help

      - name: Compute cache key
        id: cache-key
        env:
          RECIPES: ${{ inputs.recipes }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import os

          recipes = os.environ.get("RECIPES", "")
          print(f"recipes_hash={hashlib.sha256(recipes.encode('utf-8')).hexdigest()}")
          PY

      - name: Restore ThirdParty build cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: Tools/ThirdParty/build
          key: thirdparty-${{ inputs.target_os }}-${{ inputs.target_arch }}-${{ steps.cache-key.outputs.recipes_hash }}-${{ hashFiles('.github/workflows/thirdparty*.yml', 'Tools/ThirdParty/pyproject.toml', 'Tools/ThirdParty/src/**', 'Tools/ThirdParty/recipes/**') }}
          restore-keys: |
            thirdparty-${{ inputs.target_os }}-${{ inputs.target_arch }}-${{ steps.cache-key.outputs.recipes_hash }}-
            thirdparty-${{ inputs.target_os }}-${{ inputs.target_arch }}-

      - name: Build ThirdParty
        working-directory: ${{ env.THIRDPARTY_ROOT }}
        timeout-minutes: 330
        env:
          RECIPES: ${{ inputs.recipes }}
          CC: ${{ inputs.target_arch == 'ARM' && 'aarch64-linux-gnu-gcc' || 'x86_64-linux-gnu-gcc' }}
          CXX: ${{ inputs.target_arch == 'ARM' && 'aarch64-linux-gnu-g++' || 'x86_64-linux-gnu-g++' }}
          AR: ${{ inputs.target_arch == 'ARM' && 'aarch64-linux-gnu-ar' || 'x86_64-linux-gnu-ar' }}
          RANLIB: ${{ inputs.target_arch == 'ARM' && 'aarch64-linux-gnu-ranlib' || 'x86_64-linux-gnu-ranlib' }}
          STRIP: ${{ inputs.target_arch == 'ARM' && 'aarch64-linux-gnu-strip' || 'x86_64-linux-gnu-strip' }}
        run: |
          set -euo pipefail

          recipes=()
          if [ -n "${RECIPES// }" ]; then
            read -r -a recipes <<< "$RECIPES"
          fi

          thirdparty build \
            --target-os "${{ inputs.target_os }}" \
            --target-arch "${{ inputs.target_arch }}" \
            --fail-fast \
            "${recipes[@]}"
