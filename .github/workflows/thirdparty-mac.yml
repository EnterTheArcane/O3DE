name: ThirdParty Mac

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      target_os:
        required: true
        type: string
      target_arch:
        required: true
        type: string
      recipes:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      image:
        description: Image
        required: false
        type: string
        default: macos-15
      target_os:
        description: Target OS
        required: false
        type: string
        default: Mac
      target_arch:
        description: Target Arch
        required: false
        type: choice
        options:
          - ARM
        default: ARM
      recipes:
        description: "Optional whitespace-separated recipe names or glob patterns. Blank builds everything."
        required: false
        type: string

run-name: ThirdParty Mac ${{ inputs.target_arch }}

jobs:
  Build:
    runs-on: ${{ inputs.image }}

    env:
      THIRDPARTY_ROOT: Tools/ThirdParty

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Tools/ThirdParty/pyproject.toml

      - name: Install ThirdParty tool
        run: python -m pip install -e "${{ env.THIRDPARTY_ROOT }}"

      - name: Check ThirdParty command
        run: thirdparty --help

      - name: Compute cache key
        id: cache-key
        env:
          RECIPES: ${{ inputs.recipes }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import os

          recipes = os.environ.get("RECIPES", "")
          print(f"recipes_hash={hashlib.sha256(recipes.encode('utf-8')).hexdigest()}")
          PY

      - name: Restore ThirdParty build cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: Tools/ThirdParty/build
          key: thirdparty-${{ inputs.target_os }}-${{ inputs.target_arch }}-${{ steps.cache-key.outputs.recipes_hash }}-${{ hashFiles('.github/workflows/thirdparty*.yml', 'Tools/ThirdParty/pyproject.toml', 'Tools/ThirdParty/src/**', 'Tools/ThirdParty/recipes/**') }}
          restore-keys: |
            thirdparty-${{ inputs.target_os }}-${{ inputs.target_arch }}-${{ steps.cache-key.outputs.recipes_hash }}-
            thirdparty-${{ inputs.target_os }}-${{ inputs.target_arch }}-

      - name: Build
        working-directory: ${{ env.THIRDPARTY_ROOT }}
        timeout-minutes: 330
        env:
          RECIPES: ${{ inputs.recipes }}
        run: |
          set -euo pipefail

          recipes=()
          if [ -n "${RECIPES// }" ]; then
            read -r -a recipes <<< "$RECIPES"
          fi

          thirdparty build \
            --target-os "${{ inputs.target_os }}" \
            --target-arch "${{ inputs.target_arch }}" \
            "${recipes[@]}"
