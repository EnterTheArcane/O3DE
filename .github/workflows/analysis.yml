name: Analysis

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  inspect-code:
    name: Inspect Code
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup CMake
        uses: lukka/get-cmake@f176ccd3f28bda569c43aae4894f06b2435a3375 # v4.2.3
        with:
          useCloudCache: true
          useLocalCache: true
          cmakeVersion: "4.2.3"
          ninjaVersion: "1.13.2"

      - name: Configure
        env:
          CMAKE_BUILD_TYPE: Release
          CMAKE_GENERATOR: Visual Studio 17 2022
        run: cmake -B Build

      - name: Annotate
        uses: JetBrains/ReSharper-InspectCode@v0.11
        with:
          solution: Build/O3DE.sln

    permissions:
      security-events: write
