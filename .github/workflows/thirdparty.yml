name: ThirdParty

run-name: ThirdParty - ${{ github.ref_name }}

on:
  push:
  workflow_dispatch:
    inputs:
      build_mac_arm:
        description: Build Mac ARM
        required: false
        type: boolean
        default: true
      build_linux_arm:
        description: Build Linux ARM
        required: false
        type: boolean
        default: true
      build_linux_x64:
        description: Build Linux X64
        required: false
        type: boolean
        default: true
      build_windows_arm:
        description: Build Windows ARM
        required: false
        type: boolean
        default: true
      build_windows_x64:
        description: Build Windows X64
        required: false
        type: boolean
        default: true

jobs:
  linux-arm:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux_arm }}
    uses: ./.github/workflows/thirdparty-linux.yml
    with:
      arch: ARM

  linux-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux_x64 }}
    uses: ./.github/workflows/thirdparty-linux.yml
    with:
      arch: X64

  mac-arm:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mac_arm }}
    uses: ./.github/workflows/thirdparty-mac.yml
    with:
      arch: ARM

  mac-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mac_arm }}
    uses: ./.github/workflows/thirdparty-mac.yml
    with:
      arch: X64

  windows-arm:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows_arm }}
    uses: ./.github/workflows/thirdparty-windows.yml
    with:
      arch: ARM

  windows-X64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows_x64 }}
    uses: ./.github/workflows/thirdparty-windows.yml
    with:
      arch: X64
