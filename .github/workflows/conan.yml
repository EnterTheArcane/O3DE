name: OCI Apple platform labels preview

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15'
      - run: python -m pip install -r Tools/Conan/requirements.txt
      - name: Publish the OpenEXR Apple label preview
        env:
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_TAG: platform-names-preview-${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          import requests

          sys.path.insert(0, "Tools/Conan/scripts")
          from publish import IMAGE_INDEX, IMAGE_MANIFEST, prepare, publish_catalogs

          registry = "ghcr.io/enterthearcane/3rdparty"
          repository = "enterthearcane/3rdparty/openexr"
          base = f"https://ghcr.io/v2/{repository}"
          baseline = "sha256:e7cfb7909d2d781ea235ec213edccd0eb54dc72bfa5ca265b3a47ca2c2d5c417"
          tag = os.environ["PREVIEW_TAG"]
          targets = {"ios-a64", "ios-simulator-a64", "macos-a64"}
          candidates = []
          token_result = requests.get(
              "https://ghcr.io/token",
              params={"service": "ghcr.io", "scope": f"repository:{repository}:pull"},
              timeout=30,
          )
          token_result.raise_for_status()
          token = token_result.json()["token"]

          def fetch(kind, digest, accept="*/*"):
              response = requests.get(
                  f"{base}/{kind}/{digest}",
                  headers={"Authorization": f"Bearer {token}", "Accept": accept},
                  timeout=60,
              )
              response.raise_for_status()
              if f"sha256:{hashlib.sha256(response.content).hexdigest()}" != digest:
                  raise ValueError(f"Digest mismatch for {digest}")
              return response.content

          index = json.loads(fetch("manifests", baseline, IMAGE_INDEX))
          for descriptor in index["manifests"]:
              annotations = descriptor["annotations"]
              profile = f"{annotations['platform.os']}-{annotations['platform.architecture']}"
              if profile not in targets or annotations["build.type"] != "Release":
                  continue
              manifest = json.loads(fetch("manifests", descriptor["digest"], IMAGE_MANIFEST))
              layer, = manifest["layers"]
              output = Path("build/preview") / profile
              packages = output / "release/packages"
              packages.mkdir(parents=True)
              archive = Path(layer["annotations"]["org.opencontainers.image.title"]).name
              (packages / archive).write_bytes(fetch("blobs", layer["digest"]))
              (packages / "packages.json").write_text(
                  json.dumps({"openexr": {"archive": archive, "identity": f"openexr/{tag}"}}),
                  encoding="utf-8",
              )
              prepare(profile, output, registry, cache=None)
              candidates.append((profile, output))

          if {profile for profile, _ in candidates} != targets:
              raise ValueError("The source index is missing an Apple platform")
          publish_catalogs(candidates, registry, command="push")
          print(f"Preview tag: {registry}/openexr:{tag}")
          PY
