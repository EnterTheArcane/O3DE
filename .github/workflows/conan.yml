name: Conan Packages

on:
  workflow_dispatch:
    inputs:
      build-android-a64:
        description: Android (A64)
        type: boolean
        default: false
      build-android-x64:
        description: Android (X64)
        type: boolean
        default: false
      build-emscripten-w32:
        description: Emscripten (W32)
        type: boolean
        default: false
      build-emscripten-w64:
        description: Emscripten (W64)
        type: boolean
        default: false
      build-ios-a64:
        description: iOS (A64)
        type: boolean
        default: false
      build-ios-simulator-a64:
        description: iOS-Simulator (A64)
        type: boolean
        default: false
      build-linux-a64:
        description: Linux (A64)
        type: boolean
        default: false
      build-linux-x64:
        description: Linux (X64)
        type: boolean
        default: false
      build-macos-a64:
        description: macOS (A64)
        type: boolean
        default: false
      build-windows-a64:
        description: Windows (A64)
        type: boolean
        default: false
      build-windows-x64:
        description: Windows (X64)
        type: boolean
        default: false
      cache_run_id:
        description: Previous Cache Run Id
        type: string
      publish:
        description: Publish
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-slim
    permissions: {}
    outputs:
      targets: ${{ steps.targets.outputs.result }}
    steps:
      - name: Collect build targets
        id: targets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        with:
          script: |
            const runners = {
              android: "ubuntu-26.04",
              emscripten: "ubuntu-26.04",
              ios: "macos-26",
              linux: "ubuntu-26.04",
              macos: "macos-26",
              windows: "windows-2025-vs2026",
            };
            const inputs = JSON.parse(process.env.DISPATCH_INPUTS);
            const prefix = "build-";
            const targets = [];
            for (const [name, enabled] of Object.entries(inputs)) {
              if (!name.startsWith(prefix) || enabled !== true) {
                continue;
              }
              const profile = name.slice(prefix.length);
              const platform = profile.split("-", 1)[0];
              if (!Object.hasOwn(runners, platform)) {
                throw new Error(`No runner for profile ${profile}.`);
              }
              targets.push({ profile, runner: runners[platform] });
            }
            if (targets.length === 0) {
              throw new Error("Select at least one target profile.");
            }
            return targets;

  build:
    name: Build (${{ matrix.profile }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: &package_matrix
        include: ${{ fromJSON(needs.prepare.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_PROFILE: ${{ matrix.profile }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}/3rdparty
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        if: startsWith(matrix.profile, 'android-')
        with:
          distribution: zulu
          java-version: '21'
      - name: Make room for native and target Linux SDKs
        if: matrix.profile == 'linux-a64'
        shell: bash
        run: sudo rm -rf -- /usr/local/lib/android/sdk/ndk
      - uses: emscripten-core/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e
        if: startsWith(matrix.profile, 'emscripten-')
        with:
          emsdk-version: '7.0.1'
      - name: Restore compilation cache
        if: github.run_attempt > 1 || inputs.cache_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: compilation-cache-${{ matrix.profile }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.cache_run_id || github.run_id }}
      - name: Install ccache on Windows
        if: runner.os == 'Windows'
        run: |
          # CMake passes clang-cl dependency flags that older ccache versions mishandle.
          $release = 'ccache-4.14.3-windows-x86_64'
          $zip = Join-Path $env:RUNNER_TEMP "$release.zip"
          Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v4.14.3/$release.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'c845c3d65be81954c75659145a522a793a27586bf940c5dcfe18af33fa1a67dd') {
            throw 'Unexpected ccache archive checksum.'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP $release | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Set up ccache
        uses: chocobo1/setup-ccache-action@37c3347f8a7738e82aab7a06f276f7a12e3008fb
        with:
          install_ccache: ${{ runner.os != 'Windows' }}
          windows_compile_environment: msvc
          store_cache: false
          restore_cache: false
          ccache_options: |
            cache_dir=${{ github.workspace }}/.ccache
            hash_dir=false
            max_size=3G
      - name: Load Apple signing identity
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          APPLE_CODE_SIGN_IDENTITY: ${{ vars.APPLE_CODE_SIGN_IDENTITY }}
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: bash Tools/Conan/scripts/install_apple_signing.sh
      - name: Build and validate OCI layout
        timeout-minutes: 285
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./Tools/Conan/scripts/ci.ps1 -Profile $env:PACKAGE_PROFILE -Registry $env:REGISTRY -CacheArchive build/imaging/conan-cache.tgz
      - name: Export completed Conan packages
        if: "!cancelled()"
        continue-on-error: true
        run: |
          if (Get-Command conan -ErrorAction SilentlyContinue) {
            python Tools/Conan/scripts/build.py export-cache --output build/imaging --cache-archive build/imaging/conan-cache.tgz
          }
      - name: Save compilation cache for reruns
        if: "!cancelled()"
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compilation-cache-${{ matrix.profile }}
          overwrite: true
          retention-days: 2
          compression-level: 0
          include-hidden-files: true
          path: |
            .ccache
            build/imaging/conan-cache.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          name: oci-${{ matrix.profile }}
          compression-level: 0
          path: |
            build/imaging/oci
            build/imaging/${{ matrix.profile }}.json
            build/imaging/release/packages/packages.json
            build/imaging/debug/packages/packages.json

  publish:
    name: Publish
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}/3rdparty
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: oci-*
          path: build/candidates
      - name: Install Python publisher
        run: |
          python3 -m venv build/imaging-publish
          build/imaging-publish/bin/python -m pip install -r Tools/Conan/requirements.txt
      - name: Publish by digest
        env:
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publisher=build/imaging-publish/bin/python
          for candidate in build/candidates/oci-*; do
            "$publisher" Tools/Conan/scripts/publish.py push "${candidate##*/oci-}" --output "$candidate" --registry "$REGISTRY"
          done
      - name: Verify public access by digest
        run: |
          publisher=build/imaging-publish/bin/python
          for candidate in build/candidates/oci-*; do
            "$publisher" Tools/Conan/scripts/publish.py verify "${candidate##*/oci-}" --output "$candidate" --registry "$REGISTRY"
          done
          jq -s add build/candidates/oci-*/*.json > build/imaging-catalog.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imaging-candidate-catalog
          path: build/imaging-catalog.json

  consume:
    name: Consume
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix: *package_matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      PACKAGE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: imaging-candidate-catalog
          path: build/catalog
      - uses: emscripten-core/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e
        if: startsWith(matrix.profile, 'emscripten-')
        with:
          emsdk-version: '7.0.1'
      - name: Build and test against an empty OCI cache
        shell: pwsh
        run: ./Tools/Conan/scripts/ci.ps1 -Profile $env:PACKAGE_PROFILE -Registry ghcr.io -PublishedCatalog build/catalog/imaging-catalog.json

  promote:
    name: Promote
    needs: consume
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: imaging-candidate-catalog
          path: build/catalog
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imaging-catalog
          path: build/catalog/imaging-catalog.json
