name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      linux:
        description: Linux
        type: boolean
        required: false
        default: true
      mac:
        description: Mac
        type: boolean
        required: false
        default: true
      windows:
        description: Windows
        type: boolean
        required: false
        default: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        uses: actions/github-script@v7
        with:
          script: |
            const isDispatch = context.eventName === "workflow_dispatch";
            const dispatchInputs = (context.payload && context.payload.inputs) ? context.payload.inputs : {};

            const pick = (name) => String(dispatchInputs[name] ?? "true") === "true";

            const wantLinux = !isDispatch || pick("linux");
            const wantMac = !isDispatch || pick("mac");
            const wantWindows = !isDispatch || pick("windows");

            const include = [];
            if (wantLinux) include.push({ platform: "Linux", image: "ubuntu-24.04" });
            if (wantMac) include.push({ platform: "Mac", image: "macos-26" });
            if (wantWindows) include.push({ platform: "Windows", image: "windows-2022" });

            if (include.length === 0) {
              core.setFailed("No platforms selected.");
              return;
            }

            core.setOutput("matrix", JSON.stringify({ include }));

  build:
    name: Build ${{ matrix.platform }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Git lfs pull
        run: |
          git lfs install
          git lfs pull

      - name: Restore cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.o3de
          key: o3de-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            o3de-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup cmake
        uses: lukka/get-cmake@v4.2.1
        with:
          cmakeVersion: "4.2.1"
          ninjaVersion: "1.13.2"
          useCloudCache: true
          useLocalCache: true

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: matrix.platform == 'Linux'
        continue-on-error: true
        run: |
          pushd scripts/build/build_node/Platform/Linux
          sudo ./install-ubuntu.sh
          popd

      - name: Build
        timeout-minutes: 330
        env:
          LY_PACKAGE_SERVER_URLS: https://d1gg6ket0m44ly.cloudfront.net;https://d3t6xeg4fgfoum.cloudfront.net
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          SCCACHE_GHA_ENABLED: true
        run: python -u scripts/build/ci_build.py --platform ${{ matrix.platform }} --type profile

      - name: Save cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.o3de
          key: ${{ steps.cache.outputs.cache-primary-key }}
