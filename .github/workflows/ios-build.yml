name: iOS Build

# These jobs are to be triggered by ar.yml

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      image:
        type: string
        default: macos-15-intel
      config:
        type: string
        required: true
      type:
        type: string
        required: true
      last_artifact:
        type: boolean
        required: false
      cmake_version:
        type: string
        required: false

run-name: iOS - ${{ inputs.type }}

# Note: All 3P Github Actions use the commit hash for security reasons
# Avoid using the tag version, which is vulnerable to supply chain attacks

jobs:
  Build:
    runs-on: ${{ inputs.image }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          show-progress: false

      - name: Git LFS pull
        run: |
          git lfs install
          git lfs pull

      - name: Setup 3p, user, and build folders
        run: |
          mkdir -p .o3de/python build 3rdParty \
            Cache/CCache Cache/PythonPackages Cache/3rdPartyPackages Cache/AutomatedTestingCache
          ln -sf "$(pwd)/.o3de" ~/.o3de
          ln -sfn "$(pwd)/Cache/PythonPackages" .o3de/python/downloaded_packages
          ln -sfn "$(pwd)/Cache/3rdPartyPackages" 3rdParty/downloaded_packages
          ln -sfn "$(pwd)/Cache/AutomatedTestingCache" AutomatedTesting/Cache

      - name: Setup Cache
        uses: ./.github/actions/cache-artifact
        with:
          name: cache-ios-${{ inputs.config }}
          search-previous: ${{ inputs.last_artifact }}
          save: ${{ !contains(inputs.type, 'test') }}

      - name: Setup ccache
        uses: chocobo1/setup-ccache-action@37c3347f8a7738e82aab7a06f276f7a12e3008fb # v1.5.3
        continue-on-error: true
        if: always()
        with:
          prepend_symlinks_to_path: false
          store_cache: false
          restore_cache: false
          ccache_options: |
            cache_dir=${{ github.workspace }}/Cache/CCache
            hash_dir=false
            max_size=10G

      - name: Setup cmake
        # Pin the version of cmake
        if: ${{ inputs.cmake_version }}
        uses: lukka/get-cmake@f176ccd3f28bda569c43aae4894f06b2435a3375 # v4.2.3
        with:
          cmakeVersion: ${{ inputs.cmake_version }}

      - name: Configure environment
        continue-on-error: true
        run: |
          echo "Installing dependencies"
          brew install --quiet xcbeautify
          echo "Getting python..."
          ./python/get_python.sh
          echo "Installing additional python dependencies..."
          ./python/pip.sh install tempfile2 PyGithub
          df -h

      - name: Build (${{ inputs.type }})
        # Builds with presets in ../scripts/build/Platform/iOS/build_config.json
        timeout-minutes: 330
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          LY_3RDPARTY_PATH: ${{ github.workspace }}/3rdParty
          LY_PACKAGE_SERVER_URLS: https://d1gg6ket0m44ly.cloudfront.net;https://d3t6xeg4fgfoum.cloudfront.net
        run: python/python.sh -u scripts/build/ci_build.py --platform iOS --type ${{ inputs.type }}


