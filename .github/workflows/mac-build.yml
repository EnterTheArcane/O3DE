name: Mac Build

# These jobs are to be triggered by ar.yml

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      config:
        required: true
        type: string
      image:
        required: true
        type: string
      platform:
        required: true
        type: string
      type:
        required: true
        type: string
      clang_version:
        required: false
        type: string
      cmake_version:
        required: false
        type: string

run-name: ${{ inputs.platform }} - ${{ inputs.type }}

# Note: All 3P GitHub Actions use the commit hash for security reasons
# Avoid using the tag version, which is vulnerable to supply chain attacks

jobs:
  build:
    name: Build

    strategy:
      fail-fast: false

    runs-on: ${{ inputs.image }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          show-progress: false

      - name: Git LFS pull
        # Minimal pull for profile builds, otherwise pull all
        run: |
          git lfs install
          [[ "${{ inputs.type }}" == "profile" ]] && git lfs pull --include "*.ico,*.bmp" || git lfs pull

      - name: Setup cmake
        # Pin the version of cmake
        if: ${{ inputs.cmake_version }}
        uses: lukka/get-cmake@9e07ecdcee1b12e5037e42f410b67f03e2f626e1 # v4.2.1
        with:
          cmakeVersion: "${{ inputs.cmake_version }}"

      - name: Install specific clang version
        if: ${{ inputs.clang_version }}
        run: |
          brew install llvm@${{ inputs.clang_version }}
          echo "CC=$(brew --prefix llvm@${{ inputs.clang_version }})/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm@${{ inputs.clang_version }})/bin/clang++" >> $GITHUB_ENV

      - name: Build ${{ inputs.type }}
        # Builds with presets in ../scripts/build/Platform/Mac/build_config.json
        timeout-minutes: 330
        run: |
          export LY_3RDPARTY_PATH=${{ github.workspace }}/3rdParty
          export LY_PACKAGE_SERVER_URLS="https://d1gg6ket0m44ly.cloudfront.net;https://d3t6xeg4fgfoum.cloudfront.net"
          export EXTRA_CMAKE_OPTIONS="-DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX"
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          python/python.sh -u scripts/build/ci_build.py --platform ${{ inputs.platform }} --type ${{ inputs.type }}
