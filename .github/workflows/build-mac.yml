name: Build Mac

on:
  push:

jobs:
  build:
    name: Build

    strategy:
      fail-fast: false

    # runs-on: macos-26
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Git lfs pull
        run: |
          git lfs install
          git lfs pull

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: ~/.o3de
          key: ${{ runner.os }}-${{ runner.arch }}

      - name: Setup cmake
        uses: lukka/get-cmake@v4.2.1
        with:
          cmakeVersion: "4.2.1"
          ninjaVersion: "1.13.2"
          useCloudCache: true
          useLocalCache: true

      - name: Configure environment
        continue-on-error: true
        run: |
          python/get_python.sh
          python/pip.sh install tempfile2 PyGithub

      - name: Build (Profile)
        timeout-minutes: 330
        env:
          LY_PACKAGE_SERVER_URLS: "https://d1gg6ket0m44ly.cloudfront.net;https://d3t6xeg4fgfoum.cloudfront.net"
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          SCCACHE_GHA_ENABLED: true
        run: python/python.sh -u scripts/build/ci_build.py --platform Mac --type profile
