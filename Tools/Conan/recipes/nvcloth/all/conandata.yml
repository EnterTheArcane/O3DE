  "1.1.6":
    - patch_file: "patches/arm64-compatibility.patch"
      patch_type: "portability"
      patch_description: "Use target SIMD guards and include the definition of size_t"
    - patch_file: "patches/windows-simd.patch"
      patch_type: "portability"
      patch_description: "Use SSE wrappers with clang-cl and restrict AVX to x86 builds"
