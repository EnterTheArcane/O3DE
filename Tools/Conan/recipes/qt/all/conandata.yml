sources:
  "6.12.0":
    url: "https://download.qt.io/official_releases/qt/6.12/6.12.0/single/qt-everywhere-src-6.12.0.tar.xz"
    sha256: "98ff4f44bac6ec3e1e62ee2a4316ae0e3d15badb015d753cc0268a20db52f165"

patches:
  "6.12.0":
    - patch_file: "patches/ios-assets-library.patch"
    - patch_file: "patches/terminate-header.patch"
      patch_description: "Include the declaration of std::terminate with Emscripten 7 libc++"
    - patch_file: "patches/wasm-resize-observer-pointer.patch"
      patch_description: "Pass resize observer pointers as integers supported by Emscripten embind"
    - patch_file: "patches/installed-build-metadata.patch"
      patch_description: "Keep the build workspace out of Qt SPDX and toolchain files"
    - patch_file: "patches/wasm-relocatable-library-path.patch"
      patch_description: "Resolve the shared WebAssembly library directory from the installed SDK"
      patch_type: portability
