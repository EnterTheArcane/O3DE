patches:
  "2.6.0":
    - patch_file: patches/desktop-macos-frameworks.patch
      patch_description: Link monitor and color profile frameworks only on macOS
      patch_type: portability
    - patch_file: patches/conan-minizip-config.patch
      patch_description: Resolve minizip from the target package during cross builds
      patch_type: portability
