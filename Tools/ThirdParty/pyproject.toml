[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdparty"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4",
    "fasteners>=0.15",
    "jinja2>=3.0",
    "packaging>=24.0",
    "patch-ng>=1.17.4",
    "PyGithub>=2.0",
    "pygments>=2.0",
    "python-dateutil>=2.8",
    "python-gitlab>=4.0",
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "autotyping>=24.3",
    "libcst>=1.3",
    "monkeytype>=23.3",
    "pyright>=1.1.0",
]

[project.scripts]
thirdparty = "thirdparty:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thirdparty = ["py.typed"]
