[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdparty"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4",
    "fasteners>=0.15",
    "jinja2>=3.0",
    "packaging>=24.0",
    "patch-ng>=1.17.4",
    "PyGithub>=2.0",
    "pygments>=2.0",
    "python-dateutil>=2.8",
    "python-gitlab>=4.0",
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.0",
    "libcst>=1.3",
]

[project.scripts]
thirdparty = "thirdparty._internal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
